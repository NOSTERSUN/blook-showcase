<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2D2016;--gold:#A0784A;--gold-light:#C9A96E;--gold-dim:#8B6B3D;--bg:#FFFFFF;--bg2:#FAF8F5;--bg3:#F2EDE6;--neutral:#6B5E50;--dim:#9A8E7F;--border:rgba(160,120,74,.12);--border2:rgba(160,120,74,.30)}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Inter','IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--primary);line-height:1.6;overflow-x:hidden;max-width:100vw;position:relative}
::selection{background:var(--gold-light);color:#fff}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 60px;height:80px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:14px;text-decoration:none}
.nav-mark{font-family:'Cormorant Garamond','Noto Serif Thai',serif;font-size:2rem;color:var(--gold);font-style:italic;letter-spacing:-.03em;line-height:1}
.nav-mark span{font-size:.55rem;display:block;font-style:normal;letter-spacing:.35em;color:var(--dim);margin-top:2px;font-family:'Inter','IBM Plex Sans Thai',sans-serif}
.nav-links{display:flex;align-items:center;gap:40px}
.nav-links a{text-decoration:none;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--neutral);transition:color .3s;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s}
.nav-links a:hover{color:var(--primary)}
.nav-links a:hover::after{width:100%}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:8px;z-index:1001}
.nav-toggle span{width:24px;height:2px;background:var(--primary);display:block;transition:all .3s}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.hero-mini{padding:150px 60px 60px;text-align:center;background:linear-gradient(170deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border)}
.hero-mini .eyebrow{font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.hero-mini h1{font-family:'Fraunces','Noto Serif Thai',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:400;margin-bottom:14px;color:var(--primary)}
.hero-mini h1 em{color:var(--gold);font-style:italic}
.hero-mini p{font-size:1.05rem;color:var(--neutral);max-width:520px;margin:0 auto;font-weight:300}

/* Gallery masonry (cream) */
.gallery-wrap{padding:60px;background:linear-gradient(180deg,var(--bg3),var(--bg2))}
.gov-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;grid-auto-flow:dense;gap:16px;max-width:1500px;margin:0 auto}
.gov-tile{position:relative;height:100%;border-radius:12px;overflow:hidden;cursor:zoom-in;border:1px solid var(--border);background:#fff;box-shadow:0 4px 18px rgba(120,90,40,.07);opacity:0;transform:translateY(18px)}
.gov-tile.gov-big{grid-column:span 2;grid-row:span 2}
.gov-tile.gov-wide{grid-column:span 2}
.gov-tile.gov-tall{grid-row:span 2}
.gov-tile.in{animation:govIn .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--d,0s)}
@keyframes govIn{to{opacity:1;transform:none}}
.gov-tile:hover{box-shadow:0 14px 36px rgba(120,90,40,.2);border-color:var(--gold)}
.gov-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.gov-tile:hover img{transform:scale(1.05)}
.gov-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(45,32,22,.5),transparent 55%);opacity:0;transition:opacity .35s}
.gov-tile:hover::after{opacity:1}
.gov-zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:2}
.gov-tile:hover .gov-zoom{opacity:1;transform:scale(1)}
.gov-zoom svg{width:38px;height:38px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}

/* Lightbox */
#lightbox{position:fixed;inset:0;z-index:10000;background:rgba(20,14,8,.95);display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:92%;max-height:92%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lightbox .lb-close{position:absolute;top:20px;right:26px;color:#fff;font-size:2rem;cursor:pointer;opacity:.7;line-height:1}
#lightbox .lb-close:hover{opacity:1}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1.8rem;cursor:pointer;transition:all .2s}
#lightbox .lb-nav:hover{background:var(--gold)}
#lightbox .lb-prev{left:24px}#lightbox .lb-next{right:24px}
#lightbox .lb-share{position:absolute;top:18px;left:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:3}
#lightbox .lb-share:hover{background:var(--gold)}
#lightbox .lb-share svg{width:20px;height:20px;fill:#fff}

footer{background:var(--primary);border-top:1px solid var(--border);padding:40px 60px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.foot-brand{font-family:'Cormorant Garamond','Noto Serif Thai',serif;font-size:1.3rem;color:var(--gold-light);font-style:italic}
.foot-copy{font-size:.7rem;color:rgba(255,255,255,.35);letter-spacing:.12em}

@media(max-width:1024px){nav{padding:0 36px}.gov-grid{grid-template-columns:repeat(3,1fr)}.gallery-wrap{padding:50px 30px}}
@media(max-width:768px){
  nav{padding:0 20px;height:60px}.nav-mark{font-size:1.6rem}
  .nav-toggle{display:flex}
  .nav-links{position:fixed;top:60px;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-direction:column;align-items:flex-start;gap:0;padding:6px 22px 16px;border-bottom:1px solid var(--border);box-shadow:0 14px 30px rgba(0,0,0,.1);display:none}
  .nav-links.open{display:flex}
  .nav-links a{font-size:.92rem;letter-spacing:.1em;padding:14px 2px;width:100%;border-bottom:1px solid var(--border)}
  #lang-toggle{font-size:.92rem!important;letter-spacing:.1em!important;padding:14px 2px!important;text-align:left;width:100%;opacity:1}
  #admin-btn{padding:12px 2px;width:100%}
  .hero-mini{padding:100px 20px 44px}
  .hero-mini p{font-size:clamp(.55rem,2.9vw,1.05rem);white-space:nowrap;letter-spacing:0}
  .gov-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.gallery-wrap{padding:36px 16px}
  footer{padding:30px 20px;flex-direction:column;text-align:center}
}
</style>
</head>

<script>
// Language toggle (shared across pages via localStorage)
(function(){
  var lang=localStorage.getItem('blook-lang')||'th', done=false;
  function apply(l){ document.querySelectorAll('[data-th][data-en]').forEach(function(el){ var t=l==='th'?el.dataset.th:el.dataset.en; if(t!==undefined) el.innerHTML=t; }); var b=document.getElementById('lang-toggle'); if(b) b.textContent=l==='th'?'EN':'TH'; }
  function init(){ if(done)return; done=true; var b=document.getElementById('lang-toggle'); apply(lang); if(b) b.addEventListener('click',function(e){e.preventDefault();lang=lang==='th'?'en':'th';localStorage.setItem('blook-lang',lang);apply(lang);}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();

// Gallery
// 🖼️ รูปแกลเลอรีทั้งหมดอยู่ในโฟลเดอร์เดียว: assets/gallery/
// วิธีจัดการ: เพิ่มรูปใหม่ลงโฟลเดอร์ assets/gallery/ แล้วเพิ่มชื่อไฟล์ในลิสต์นี้ / ลบออกจากลิสต์เพื่อเอารูปออกจากเว็บ (ดู assets/gallery/README.txt)
const ALL_GALLERY=[
  // ไลฟ์สไตล์ (รูปจริง/บรรยากาศจริง) — แสดงก่อน
  'assets/gallery/lifestyle-01.jpg','assets/gallery/lifestyle-02.png','assets/gallery/lifestyle-03.jpg','assets/gallery/lifestyle-04.jpg','assets/gallery/lifestyle-05.jpg','assets/gallery/lifestyle-06.jpg','assets/gallery/lifestyle-07.jpg','assets/gallery/lifestyle-08.jpg','assets/gallery/lifestyle-09.png','assets/gallery/lifestyle-10.png','assets/gallery/lifestyle-11.png',
  'assets/gallery/lifestyle-12.jpg','assets/gallery/lifestyle-13.jpg','assets/gallery/lifestyle-14.jpg','assets/gallery/lifestyle-15.jpg','assets/gallery/lifestyle-16.jpg','assets/gallery/lifestyle-17.jpg','assets/gallery/lifestyle-18.jpg','assets/gallery/lifestyle-19.jpg','assets/gallery/lifestyle-20.jpg','assets/gallery/lifestyle-22.jpg','assets/gallery/lifestyle-24.jpg','assets/gallery/lifestyle-25.jpg','assets/gallery/lifestyle-26.jpg','assets/gallery/lifestyle-27.jpg','assets/gallery/lifestyle-28.jpg','assets/gallery/lifestyle-29.jpg','assets/gallery/lifestyle-30.jpg','assets/gallery/lifestyle-31.jpg',
  // สินค้า (เหลือเฉพาะไฟล์ที่มีจริงในโฟลเดอร์ หลังคัดออก)
  'assets/gallery/sofa-01.jpg','assets/gallery/sofa-02.jpg','assets/gallery/sofa-03.jpg','assets/gallery/sofa-04.jpg',
  'assets/gallery/diffuser-250-01.png','assets/gallery/diffuser-250-08.png','assets/gallery/diffuser-50-01.png',
  'assets/gallery/gift-01.png','assets/gallery/gift-08.png'
];
(function(){
  var g=document.getElementById('gov-grid');
  g.innerHTML=ALL_GALLERY.map(function(src,i){ var m=i%10, sz=(m===0?' gov-big':(m===4||m===7)?' gov-wide':m===2?' gov-tall':''); return '<figure class="gov-tile'+sz+'" style="--d:'+((i%10)*0.04)+'s"><img src="'+src+'" loading="lazy" alt="BLOOK LIVING ไลฟ์สไตล์ '+(i+1)+'"><span class="gov-zoom"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14zm.5-7v2H8v2H6V9h2V7z"/></svg></span></figure>'; }).join('');
  // reveal on scroll
  var tiles=g.querySelectorAll('.gov-tile');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -8% 0px'});
    tiles.forEach(function(t){ io.observe(t); });
  } else { tiles.forEach(function(t){ t.classList.add('in'); }); }
})();

// รูปทุกใบเปิด lightbox กลาง (คลิกรูป→ไปเว็บ, ปุ่ม "แชร์ลง IG Story" ใต้ภาพ) — มาจาก assets/share-story.js
</script>
